{% load static %}
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{{ titulo }} | SMC</title><link rel="stylesheet" href="{% static 'monitoramento/css/style.css' %}"><style>body{background:#f4f7fb;color:#183247;font-family:Segoe UI,Arial,sans-serif}.content{max-width:850px;margin:0 auto;padding:35px}.panel{background:white;padding:28px;border:1px solid #e2e8f0;border-radius:14px}.field{margin:18px 0}.field label{display:block;margin-bottom:7px;font-weight:600}.field input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.btn{padding:11px 16px;border-radius:9px;text-decoration:none;border:0;cursor:pointer;font-weight:600}.primary{background:#146c94;color:white}.cancel{background:#e2e8f0;color:#183247}</style></head><body><main class="content"><h1>{{ titulo }}</h1><section class="panel"><form method="post" data-ajax-url="{% if form.instance.pk %}{% url 'ajax_editar_participante' form.instance.pk %}{% else %}{% url 'ajax_criar_participante' %}{% endif %}" data-redirect-url="{% url 'lista_participantes' %}">{% csrf_token %}<div class="field"><label for="{{ form.nome.id_for_label }}">{{ form.nome.label }}</label>{{ form.nome }}{{ form.nome.errors }}</div><div class="actions"><a class="btn cancel" href="{% url 'lista_participantes' %}">Cancelar</a><button class="btn primary" type="submit">Salvar participante</button></div></form></section></main><script src="{% static 'monitoramento/js/crud_ajax.js' %}"></script></body></html>
